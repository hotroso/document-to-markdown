[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-to-markdown"
version = "0.6.1"
description = "100% local PDF, Office (DOCX, PPTX, Excel), Email, HTML, CSV, and image to AI-friendly Markdown converter"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = [
  "pdf",
  "docx",
  "pptx",
  "excel",
  "email",
  "outlook",
  "markdown",
  "ocr",
  "paddleocr",
  "tesseract",
  "rag",
  "llm",
  "document-converter",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Topic :: Utilities",
]
dependencies = [
  "pdfplumber>=0.11.0",
  "pypdfium2>=4.25.0",
  "openpyxl>=3.1.5",
]

[project.optional-dependencies]
ocr = [
  "paddlepaddle>=2.6.0",
  "paddleocr>=2.7.0",
  "Pillow>=10.0.0",
  "numpy>=1.24.0",
]
tesseract = [
  "pytesseract>=0.3.10",
  "Pillow>=10.0.0",
]
excel-calc = [
  "xlcalculator>=0.5.0",
]
outlook = [
  "olefile>=0.47",
]
all = [
  "paddlepaddle>=2.6.0",
  "paddleocr>=2.7.0",
  "pytesseract>=0.3.10",
  "Pillow>=10.0.0",
  "numpy>=1.24.0",
  "xlcalculator>=0.5.0",
  "olefile>=0.47",
]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
document-to-markdown = "document_converter.cli:main"

[project.urls]
Homepage = "https://github.com/hotroso/document-to-markdown"
Repository = "https://github.com/hotroso/document-to-markdown"
Issues = "https://github.com/hotroso/document-to-markdown/issues"

[tool.setuptools]
packages = ["document_converter"]
