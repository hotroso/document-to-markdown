[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-to-markdown"
version = "0.3.1"
description = "Free-form PDF, image and Excel to AI-friendly Markdown with PP-Structure / PaddleOCR"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyMuPDF>=1.23.0",
  "openpyxl>=3.1.5",
]

[project.optional-dependencies]
ocr = [
  "paddlepaddle>=2.6.0",
  "paddleocr>=2.7.0",
  "Pillow>=10.0.0",
  "numpy>=1.24.0",
]
tesseract = [
  "pytesseract>=0.3.10",
  "Pillow>=10.0.0",
]
excel-calc = [
  "formulas>=1.2.0",
]
all = [
  "paddlepaddle>=2.6.0",
  "paddleocr>=2.7.0",
  "pytesseract>=0.3.10",
  "Pillow>=10.0.0",
  "numpy>=1.24.0",
  "formulas>=1.2.0",
]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
document-to-markdown = "document_converter.cli:main"

[tool.setuptools]
packages = ["document_converter"]
