[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-to-markdown"
version = "0.4.0"
description = "Free-form PDF, image and Excel to AI-friendly Markdown with PP-Structure / PaddleOCR"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = [
  "pdf",
  "markdown",
  "ocr",
  "paddleocr",
  "tesseract",
  "excel",
  "rag",
  "llm",
  "document-converter",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Topic :: Utilities",
]
dependencies = [
  "PyMuPDF>=1.23.0",
  "openpyxl>=3.1.5",
]

[project.optional-dependencies]
ocr = [
  "paddlepaddle>=2.6.0",
  "paddleocr>=2.7.0",
  "Pillow>=10.0.0",
  "numpy>=1.24.0",
]
tesseract = [
  "pytesseract>=0.3.10",
  "Pillow>=10.0.0",
]
excel-calc = [
  "formulas>=1.2.0",
]
all = [
  "paddlepaddle>=2.6.0",
  "paddleocr>=2.7.0",
  "pytesseract>=0.3.10",
  "Pillow>=10.0.0",
  "numpy>=1.24.0",
  "formulas>=1.2.0",
]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
document-to-markdown = "document_converter.cli:main"

[project.urls]
Homepage = "https://github.com/sinhsac/document-to-markdown"
Repository = "https://github.com/sinhsac/document-to-markdown"
Issues = "https://github.com/sinhsac/document-to-markdown/issues"

[tool.setuptools]
packages = ["document_converter"]
