name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-python-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools and run tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build
          pytest -v

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload Python package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  build-standalone-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: document-to-markdown-linux-x64
          - os: windows-latest
            artifact_name: document-to-markdown-windows-x64
          - os: macos-latest
            artifact_name: document-to-markdown-macos-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install ".[tesseract,outlook]" pyinstaller

      - name: Build standalone executable
        run: |
          pyinstaller --onefile --clean --name "${{ matrix.artifact_name }}" --hidden-import fitz --hidden-import openpyxl --hidden-import PIL --hidden-import pytesseract --hidden-import extract_msg document_converter/__main__.py

      - name: Verify executable
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ./dist/${{ matrix.artifact_name }}.exe --help
          else
            ./dist/${{ matrix.artifact_name }} --help
          fi

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}*

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-python-package, build-standalone-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten release assets
        run: |
          mkdir -p upload
          find release-assets -type f -exec cp {} upload/ \;
          ls -lh upload/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: upload/*
